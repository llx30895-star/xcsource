<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XCSOURCE | Home Improvement Partner</title>
  <meta name="description" content="XCSOURCE corporate website with Brands, Products, and Contact sections." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f7f7f5;
      --accent: #d3122b;
      --accent-dark: #b60f25;
      --max-w: 1320px;
      --nav-h: 84px;
      --radius: 22px;
      --shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }

    .container {
      width: min(100%, var(--max-w));
      margin: 0 auto;
      padding: 0 28px;
    }

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      height: var(--nav-h);
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(229, 231, 235, 0.85);
    }

    .nav-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo-wrap img {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 34px;
      font-size: 15px;
      font-weight: 600;
      color: #374151;
      letter-spacing: 0.02em;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 140px;
      height: 46px;
      padding: 0 22px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 14px 28px rgba(211, 18, 43, 0.18);
      transition: 0.2s ease;
    }

    .nav-btn:hover,
    .submit-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      padding-top: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.1) 100%),
        url('assets/hero-bg.png') center center / cover no-repeat;
      color: #fff;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.16) 0%, rgba(0,0,0,0.04) 45%, rgba(0,0,0,0.12) 100%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0 90px;
    }

    .hero-logo {
      width: min(36vw, 520px);
      min-width: 220px;
      filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.18));
    }

    .section {
      padding: 110px 0;
    }

    .section-head {
      max-width: 760px;
      margin: 0 auto 52px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--accent);
    }

    .brands-section {
      background: var(--soft);
    }

    .brands-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    .brand-card {
      background: #fff;
      border-radius: 26px;
      padding: 38px 28px;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      box-shadow: 0 16px 44px rgba(15, 23, 42, 0.06);
    }

    .brand-card img {
      width: 100%;
      max-width: 280px;
      max-height: 160px;
      object-fit: contain;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .product-card {
      background: #f5f5f4;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      border: 1px solid #ededeb;
    }

    .product-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .product-card:hover img {
      transform: scale(1.03);
    }

    .contact-wrap {
      background: linear-gradient(180deg, #f7f7f7 0%, #f3f4f6 100%);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 34px;
      max-width: 920px;
      margin: 0 auto;
      box-shadow: var(--shadow);
    }

    .contact-form {
      display: grid;
      gap: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: grid;
      gap: 8px;
    }

    .form-group label {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid #d9dde5;
      border-radius: 12px;
      background: #fff;
      padding: 15px 16px;
      font: inherit;
      color: #111827;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(211, 18, 43, 0.08);
    }

    .form-group textarea {
      min-height: 170px;
      resize: vertical;
    }

    .form-group.has-error input,
    .form-group.has-error select,
    .form-group.has-error textarea {
      border-color: #dc2626;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08);
    }

    .form-error-msg {
      display: none;
      color: #dc2626;
      font-size: 13px;
      line-height: 1.4;
    }

    .form-group.has-error .form-error-msg {
      display: block;
    }

    .form-hint {
      color: #94a3b8;
      font-size: 13px;
    }

    .form-alert {
      display: none;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
    }

    .form-alert.visible { display: block; }
    .form-alert.success {
      background: #ecfdf3;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .form-alert.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .submit-btn {
      border: 0;
      border-radius: 12px;
      height: 52px;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .footer {
      padding: 34px 0 42px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
    }

    @media (max-width: 1080px) {
      .brands-grid,
      .products-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 780px) {
      :root { --nav-h: 74px; }

      .container { padding: 0 18px; }
      .nav-links { display: none; }
      .nav-btn { min-width: 116px; height: 42px; font-size: 14px; }
      .logo-wrap img { height: 30px; }

      .hero {
        min-height: 72vh;
        background-position: center center;
      }

      .hero-content { padding: 64px 0; }
      .hero-logo { width: min(62vw, 360px); min-width: 180px; }

      .section { padding: 76px 0; }
      .brand-card,
      .contact-wrap { padding: 24px; }

      .brands-grid,
      .products-grid,
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo-wrap" href="#top" aria-label="XCSOURCE home">
        <img src="assets/site-logo.png" alt="XCSOURCE logo" />
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="#brands">BTANDS</a>
        <a href="#products">PRODUCTS</a>
        <a href="#contact">CONTACT</a>
      </nav>
      <a class="nav-btn" href="#contact">Contact Us</a>
    </div>
  </header>

  <section class="hero" id="top">
    <div class="container hero-content">
      <img class="hero-logo" src="assets/site-logo.png" alt="XCSOURCE logo" />
    </div>
  </section>

  <section class="section brands-section" id="brands">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow">BTANDS</p>
      </div>

      <div class="brands-grid">
        <article class="brand-card">
          <img src="assets/brands/ikkle.png" alt="IKKLE brand logo" />
        </article>

        <article class="brand-card">
          <img src="assets/brands/miceplay.png" alt="MICEPLAY brand logo" />
        </article>

        <article class="brand-card">
          <img src="assets/brands/soulhand.png" alt="SOULHAND brand logo" />
        </article>
      </div>
    </div>
  </section>

  <section class="section" id="products">
    <div class="container">
      <div class="products-grid">
        <div class="product-card"><img src="assets/products/IK200101-A-16-1-7.jpg" alt="Product 01" /></div>
        <div class="product-card"><img src="assets/products/IK2036-A-16-mian01.jpg" alt="Product 02" /></div>
        <div class="product-card"><img src="assets/products/IK500302-A-16-1-2.jpg" alt="Product 03" /></div>
        <div class="product-card"><img src="assets/products/IK600209-A-16-1-1.jpg" alt="Product 04" /></div>
        <div class="product-card"><img src="assets/products/IK800301-A-16-1-1.jpg" alt="Product 05" /></div>
        <div class="product-card"><img src="assets/products/IK800603-A-16-2-1.jpg" alt="Product 06" /></div>
        <div class="product-card"><img src="assets/products/IK905601-A-16-1-3.jpg" alt="Product 07" /></div>
        <div class="product-card"><img src="assets/products/IK905701-A-16-2.jpg" alt="Product 08" /></div>
        <div class="product-card"><img src="assets/products/MC100101-A-16-1-2-1.jpg" alt="Product 09" /></div>
        <div class="product-card"><img src="assets/products/SH413-A-16-main1.jpg" alt="Product 10" /></div>
        <div class="product-card"><img src="assets/products/SM100102-A-16-1-1.jpg" alt="Product 11" /></div>
        <div class="product-card"><img src="assets/products/product-12.jpg" alt="Product 12" /></div>
        <div class="product-card"><img src="assets/products/product-13.jpg" alt="Product 13" /></div>
        <div class="product-card"><img src="assets/products/product-14.jpg" alt="Product 14" /></div>
        <div class="product-card"><img src="assets/products/product-15.jpg" alt="Product 15" /></div>
        <div class="product-card"><img src="assets/products/product-16.jpg" alt="Product 16" /></div>
        <div class="product-card"><img src="assets/products/product-17.jpg" alt="Product 17" /></div>
        <div class="product-card"><img src="assets/products/product-18.jpg" alt="Product 18" /></div>
      </div>
    </div>
  </section>

  <section class="section brands-section" id="contact">
    <div class="container">
      <div class="section-head">
        <p class="eyebrow">CONTACT</p>
      </div>

      <div class="contact-wrap">
        <form class="contact-form" id="coopForm" novalidate>
          <div class="form-row">
            <div class="form-group" id="fg-name">
              <label for="f-name">Full Name *</label>
              <input id="f-name" name="name" type="text" placeholder="Your full name" />
              <span class="form-error-msg">Please enter your name.</span>
            </div>
            <div class="form-group" id="fg-email">
              <label for="f-email">Email Address *</label>
              <input id="f-email" name="email" type="email" placeholder="you@example.com" />
              <span class="form-error-msg">Please enter a valid email address.</span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="f-company">Company / Organization</label>
              <input id="f-company" name="company" type="text" placeholder="Where you work (optional)" />
            </div>
            <div class="form-group" id="fg-type">
              <label for="f-type">Cooperation Type *</label>
              <select id="f-type" name="inquiry_type">
                <option>General Inquiry</option>
                <option>Business Cooperation</option>
                <option>Product Inquiry</option>
                <option>Media & Partnership</option>
              </select>
              <span class="form-error-msg">Please select an inquiry type.</span>
            </div>
          </div>

          <div class="form-group" id="fg-message">
            <label for="f-message">Your Message *</label>
            <textarea id="f-message" name="message" placeholder="Tell us about your idea, proposal, or question..."></textarea>
            <span class="form-error-msg">Please enter your message (max 2000 characters).</span>
            <span class="form-hint">Max 2000 characters.</span>
          </div>

          <div class="form-alert" id="formAlert" role="alert"></div>
          <button type="submit" class="submit-btn" id="f-submit">Send Message</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">© XCSOURCE. All rights reserved.</div>
  </footer>

  <script>
    (function () {
      var form = document.getElementById("coopForm");
      var alertBox = document.getElementById("formAlert");
      var submitBtn = document.getElementById("f-submit");

      function showAlert(type, message) {
        alertBox.textContent = message;
        alertBox.className = "form-alert visible " + type;
      }

      function clearAlert() {
        alertBox.textContent = "";
        alertBox.className = "form-alert";
      }

      function setGroupError(id, hasError) {
        var el = document.getElementById(id);
        if (!el) return;
        el.className = "form-group" + (hasError ? " has-error" : "");
      }

      function validateForm(data) {
        var ok = true;
        var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email);

        setGroupError("fg-name", !data.name);
        setGroupError("fg-email", !emailOk);
        setGroupError("fg-message", !data.message || data.message.length > 2000);

        if (!data.name || !emailOk || !data.message || data.message.length > 2000) {
          ok = false;
        }

        return ok;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        clearAlert();

        var formData = {
          name: document.getElementById("f-name").value.trim(),
          email: document.getElementById("f-email").value.trim(),
          company: document.getElementById("f-company").value.trim(),
          inquiry_type: document.getElementById("f-type").value,
          message: document.getElementById("f-message").value.trim()
        };

        if (!validateForm(formData)) {
          showAlert("error", "Please complete the required fields correctly.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";

        try {
          var res = await fetch("/api/send-email", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
          });
          var result = await res.json();

          if (!res.ok || !result.success) {
            throw new Error(result.message || "Failed to send message.");
          }

          showAlert("success", result.message || "Your message has been sent successfully.");
          form.reset();
          setGroupError("fg-name", false);
          setGroupError("fg-email", false);
          setGroupError("fg-message", false);
        } catch (err) {
          showAlert("error", err.message || "Something went wrong. Please try again later.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Send Message";
        }
      });
    })();
  </script>
</body>
</html>
